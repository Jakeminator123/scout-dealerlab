const S={data:null,view:'map',search:'',category:'all',selected:null,selectedPlacement:null,selectedSlot:null,etag:null,version:null,local:false,preview:false,auto:true,status:'',notice:'',comments:null,commentsError:null,commentsLoading:false,loading:false};
const MAIN=document.getElementById('main');
const VIEW_NAMES={map:'Rörelsekarta',slots:'Klippfack',table:'Givmål & koordinater',naming:'Namn & DL1',schemes:'Referensscheman',review:'Granskning'};
const VIEW_SUB={map:'Poser, handlingar och filmer – samlade från projektets versionsbundna kontrakt.',slots:'Produktens klippfack och de konkreta tagningar som kan fylla dem.',table:'Spelarplatser, kortordinaler och dokumenterad placeringsgeometri.',naming:'C som primär kortadress. Beställd rörelse och observerad film hålls isär.',schemes:'Källornas olika rörelsespråk – sida vid sida med tydligt ursprung.',review:'Versionsbevis och dialogen mellan lokal agent och granskare.'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const icon=(name)=>`<svg class="icon" aria-hidden="true"><use href="#ic-${name}"/></svg>`;
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const short=v=>v?String(v).slice(0,8):'okänd';
const statusLabel=s=>({approved:'Godkänd',candidate:'Kandidat',missing:'Saknas',rejected:'Avvisad',unverified:'Ej verifierad','verified-in-source':'Verifierad i källan',pending:'QA väntar',requested:'Beställning'}[s]||s||'Okänd');
const badge=(s,label)=>`<span class="badge ${esc(['approved','candidate','missing','rejected','reference','requested'].includes(s)?s:'missing')}">${esc(label||statusLabel(s))}</span>`;
function urlSafe(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function fmtDate(v){if(!v)return 'Tid saknas';const d=new Date(v);return isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('sv-SE',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/Stockholm'}).format(d)+' CET';}
function versionOf(d){const p=d.provenance||{};const hashes=p.sourceHashes&&typeof p.sourceHashes==='object'?Object.keys(p.sourceHashes).sort().map(k=>k+':'+p.sourceHashes[k]).join(';'):'';return [p.commit||p.sourceCommit||p.publicCommit||'',p.snapshot||p.snapshotId||'',p.sourceTreeSha256||p.contentId||p.manifestSha256||'',p.reviewManifestSha256||'',p.reviewSnapshot||'',p.pendingReviewSnapshot||'',d.naming?.displayVersion||'',String(p.manifestVerified??''),String(p.sourceParity??''),hashes].filter(Boolean).join('|')||null;}
function validated(d){if(!d||typeof d!=='object'||d.schemaVersion!==1||!Array.isArray(d.actions)||!Array.isArray(d.slots)||!Array.isArray(d.placements))throw Error('Kartfilen måste vara ett normaliserat Dealerlab-underlag med schemaVersion 1, actions, slots och placements.');return d;}
function issueUrl(){const candidate=urlSafe(S.data?.provenance?.issueUrl);if(candidate){const u=new URL(candidate);if(u.hostname==='github.com'&&/^\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/issues\/\d+\/?$/.test(u.pathname))return u.href;}return 'https://github.com/Jakeminator123/scout-dealerlab/issues/1';}
function issueNumber(){return new URL(issueUrl()).pathname.split('/').filter(Boolean)[3];}
function issueApi(){const u=new URL(issueUrl());const parts=u.pathname.split('/').filter(Boolean);return 'https://api.github.com/repos/'+parts[0]+'/'+parts[1]+'/issues/'+parts[3]+'/comments';}
function routeVerified(r){return r.status==='approved'||r.status==='verified-in-source';}
function mediaLink(a){return urlSafe(a?.reviewMedia?.url)||urlSafe(a?.media?.url);}
function actionById(id){return arr(S.data?.actions).find(a=>a.id===id);}
function selectedAction(){return actionById(S.selected)||arr(S.data?.actions)[0]||null;}
const DL1_FIELDS=['action','target','hand','from','to','pickupSide','landingSide','pickupVisibility','landingVisibility','ref'];
const DL1_FIELD_INFO={ref:['Hashbundet objekts-ID','Manifest + JSON-pointer + SHA-256'],action:['Handling','DEAL · RETURN · REVEAL'],target:['Givmål / berört kort','Exempel P1.C2 eller D.C3'],hand:['Dealerns anatomiska hand','L · R · BOTH · UNKNOWN'],from:['Rörelsens startpunkt','Exempel SHOE eller P1.C2.RELEASE'],to:['Rörelsens slutpunkt','Exempel P1.C2 eller VILA'],pickupSide:['Kortsida vid upptag','FRONT · BACK · EDGE · UNKNOWN'],landingSide:['Kortsida vid landning','FRONT · BACK · EDGE · UNKNOWN'],pickupVisibility:['Synlighet vid upptag','VISIBLE · PARTIAL · OCCLUDED · OUT_OF_FRAME · UNKNOWN'],landingVisibility:['Synlighet vid landning','VISIBLE · PARTIAL · OCCLUDED · OUT_OF_FRAME · UNKNOWN']};
function cardAddressConflict(item){if(!item)return false;const seat=item.seat,recipient=item.recipient;if(seat!==null&&seat!==undefined){if(!Number.isInteger(seat)||seat<1)return true;if(recipient!==null&&recipient!==undefined&&recipient!==''&&recipient!=='P'+seat)return true;}return recipient!==null&&recipient!==undefined&&recipient!==''&&recipient!=='D'&&!/^P[1-9][0-9]*$/.test(recipient);}
function structuredCardCode(item){if(!item||cardAddressConflict(item)||!Number.isInteger(item.ordinal)||item.ordinal<1)return null;const recipient=Number.isInteger(item.seat)&&item.seat>0?'P'+item.seat:item.recipient==='D'?'D':/^P[1-9][0-9]*$/.test(item.recipient||'')?item.recipient:null;return recipient?recipient+'.C'+item.ordinal:null;}
function displayCode(item){if(!item)return null;if(cardAddressConflict(item))return item.code||null;const own=structuredCardCode(item);if(own)return own;if(typeof item.displayCode==='string'&&item.displayCode)return item.displayCode;const placement=arr(S.data?.placements).find(p=>p!==item&&item.code&&(p.code===item.code||arr(p.aliases).some(a=>a?.value===item.code)));if(placement&&((item.ordinal!==null&&item.ordinal!==undefined&&item.ordinal!==placement.ordinal)||(item.recipient&&item.recipient!==placement.recipient)||(item.seat!==null&&item.seat!==undefined&&item.seat!==placement.seat)))return item.code||null;return structuredCardCode(placement)||item.code||null;}
function observedNamingLabel(a){const status=a?.motionNaming?.observed?.status;return status&&status!=='unverified'?'Källans uppgift: '+status:'Ej verifierad';}
function aliasesFor(item){const rows=arr(item?.aliases).filter(a=>a&&typeof a==='object'&&typeof a.value==='string').map(a=>({...a}));if(item?.code&&item.code!==displayCode(item)&&!rows.some(a=>a.value===item.code))rows.push({value:item.code,originalId:item.id,sourceSchema:null,sourceRevision:S.data?.identity?.revision||null,sourceSha256:S.data?.provenance?.sourceHashes?.[item.sourcePath]||null,aliasVersion:'legacy-import-display-only',kind:'source-label'});return rows;}
function searchableAliases(item){return aliasesFor(item).map(a=>a.value).join(' ');}
function aliasDetails(item){const warning=cardAddressConflict(item)?'<div class="note-box">Plats och mottagare är motstridiga. Källans adress visas utan C-konvertering.</div>':'';const aliases=aliasesFor(item);if(!aliases.length)return warning+'<p class="detail-note">Inget äldre visningsalias registrerat. Original-ID bevaras.</p>';return warning+aliases.map(a=>`<details class="alias-detail"><summary>${esc(a.value)} <span>· spårbart alias</span></summary><dl class="kv"><dt>Original-ID</dt><dd class="mono">${esc(a.originalId||item.id||'Ej angivet')}</dd><dt>Visningsmål</dt><dd class="mono">${esc(a.canonicalTarget||displayCode(item)||'Ej tillämpligt')}</dd><dt>Källcommit</dt><dd class="mono">${esc(a.sourceCommit||'Ej angiven')}</dd><dt>Källschema</dt><dd class="mono">${esc(a.sourceSchema||'Ej angivet')}</dd><dt>Källrevision</dt><dd class="mono">${esc(a.sourceRevision||'Ej angiven')}</dd><dt>Aliasversion</dt><dd class="mono">${esc(a.aliasVersion||'Ej angiven')}</dd></dl><div class="hash mono">${esc(a.sourceSha256||'Källdokumentets hash är inte angiven')}</div></details>`).join('');}
function namingFields(){const fields=arr(S.data?.naming?.fields).filter(v=>typeof v==='string');return fields.length?fields:DL1_FIELDS;}
function namedFieldRows(fields){return namingFields().map(name=>`<div class="naming-field"><span class="mono">${esc(name)}</span><strong>${esc(fields&&fields[name]!=null?fields[name]:'UNKNOWN')}</strong></div>`).join('');}
function namingEvidencePanel(a){if(!a)return '<aside class="panel detail"><div class="empty">Välj en handling för att se dess namnunderlag.</div></aside>';const mn=a.motionNaming||{},observed=mn.observed||{},context=mn.context||{},requested=mn.requested;const requestedFields=requested&&typeof requested==='object'?(requested.fields||requested):null;return `<aside class="panel detail"><div class="detail-title"><div class="eyebrow">VALD HANDLING · NAMNUNDERLAG</div><h2>${esc(displayCode(a)||a.label||a.id)}</h2><p>${esc(a.label||a.id)}</p><select class="field-select naming-select" id="namingAction" aria-label="Välj handling för namnunderlag">${arr(S.data.actions).map(x=>`<option value="${esc(x.id)}" ${x.id===a.id?'selected':''}>${esc(displayCode(x)||x.label||x.id)}</option>`).join('')}</select></div><div class="detail-section"><h3>Beställd rörelse · requested</h3>${requested?`${badge('requested','Hashbunden beställning · REQUESTED')}${requested.value?`<pre class="bound-label">${esc(requested.value)}</pre>`:''}${requested.ref?`<pre class="bound-label">${esc(JSON.stringify(requested.ref,null,2))}</pre>`:''}${typeof requested==='string'?`<pre class="dl1-string">${esc(requested)}</pre>`:namedFieldRows(requestedFields)}<p class="detail-note">En beställning beskriver önskat beteende. Ingen DL1-parser körs i denna läsvy.</p>`:`${badge('missing','Saknas')}<p class="detail-note">Ingen DL1-beställning är bunden till denna handling.</p>`}</div><div class="detail-section"><h3>Observerad film · observed</h3>${badge(observed.status&&observed.status!=='unverified'?'reference':'missing',observedNamingLabel(a))}${observed.fields?namedFieldRows(observed.fields):'<p class="detail-note">DL1-fälten saknar verifierat observationsunderlag. De tilldelas inte från filnamn eller äldre kroppsposer.</p>'}<p class="detail-note">${arr(observed.evidence).length} registrerade observationsbevis. Bevisen har inte validerats av denna läsvy; en statussträng ger ingen egen kvalitetsacceptans.</p>${arr(observed.evidence).length?`<details class="alias-detail"><summary>Visa observationsbevis</summary><pre class="dl1-string">${esc(JSON.stringify(observed.evidence,null,2))}</pre></details>`:''}</div><div class="detail-section"><h3>Separat kontext</h3><dl class="kv"><dt>Anatomisk hand</dt><dd>${esc(context.anatomicalHand||'UNKNOWN')}</dd><dt>Kameraspeglad</dt><dd>${context.cameraMirrored===true?'Ja':context.cameraMirrored===false?'Nej':'UNKNOWN'}</dd><dt>Spelhand-ID</dt><dd class="mono">${esc(context.gameHandId??'UNKNOWN')}</dd><dt>Gren-ID</dt><dd class="mono">${esc(context.branchId??'UNKNOWN')}</dd><dt>Kortinstans</dt><dd class="mono">${esc(context.cardInstanceId??'UNKNOWN')}</dd><dt>Reveal tillåten</dt><dd>${context.revealAllowed===true?'Ja':context.revealAllowed===false?'Nej':'UNKNOWN'}</dd><dt>Handfaser</dt><dd>${arr(context.handPhases).length} registrerade</dd><dt>Sidspår</dt><dd>${arr(context.sideTrack).length} registrerade</dd></dl></div><div class="detail-section"><h3>Original och alias</h3><p class="mono">${esc(a.id)}</p>${aliasDetails(a)}<button class="button" data-command="copy-review">${icon('copy')}Kopiera granskningsunderlag</button></div></aside>`;}
function namingView(){const naming=S.data.naming||{};const exampleDeal=arr(S.data.actions).find(a=>a.id==='request.p1.c2.deal')?.motionNaming?.requested?.value||'Ingen hashbunden beställning inläst';const exampleReturn=arr(S.data.actions).find(a=>a.id==='request.p1.c2.return-vila')?.motionNaming?.requested?.value||'Ingen hashbunden beställning inläst';return `<div><section class="panel"><div class="panel-head"><div><h2>C-adresser & DL1</h2><p>${esc(naming.displayVersion||'DL1-display-1')} · dokumentationsförslag</p></div>${badge('reference','Läsbar norm')}</div><div class="panel-body"><div class="notation-grid"><div><strong>P2.C2</strong><span>Spelare 2 · kort 2</span></div><div><strong>D.C3</strong><span>Dealer · kort 3</span></div><div><strong>P2.K2</strong><span>Äldre alias · spåras till originalet</span></div></div><p class="detail-note">C används som primär kortadress. Originalfiler, klipp-ID:n och källschema behåller sina identiteter. Adressen anger mottagare och kortordinal, inte geometriska x/y-koordinater.</p>${!S.data.naming?'<div class="warning-banner" style="margin-top:14px">Denna äldre kartfil saknar namnnorm. Här visas dokumentationsförslaget; C-adresser härleds endast för visning från plats och kortordinal. Källdata ändras inte.</div>':''}</div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>DL1 · fast fältordning</h2><p>Dokumentation av strukturerade rörelseuppgifter</p></div></div><div class="panel-body"><div class="dl1-fields">${namingFields().map((name,index)=>`<div class="dl1-field-row"><span class="field-number">${index+1}</span><div><strong class="mono">${esc(name)}</strong><small>${esc(DL1_FIELD_INFO[name]?.[0]||'Fält från källnormen')}</small></div><span>${esc(DL1_FIELD_INFO[name]?.[1]||'Se källnorm')}</span></div>`).join('')}</div><div class="note-box" style="margin-top:15px">hand=L/R beskriver dealerns anatomiska vänster/höger. Kamerans spegling och spelhandens ID är separata fält. REVEAL skrivs ut som handling; R används inte som fristående handlings- eller posealias.</div><p class="detail-note">Äldre action.from/to anger kroppsposer. Dessa fält kopieras inte automatiskt till DL1:s rörelseändpunkter.</p></div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Två inlästa beställningar</h2><p>Hashbundna REQUESTED-projektioner · inte observerad film</p></div>${badge('candidate','Exempel')}</div><div class="panel-body"><h3 class="view-heading">Giv till P1.C2 · hand UNKNOWN</h3><pre class="dl1-string">${esc(exampleDeal)}</pre><p class="detail-note">Beställd transport från sko till givmål. Hand, fysisk sida och synlighet kommer från den hashbundna projektionen; UNKNOWN fylls inte i från filnamn eller overlay.</p><h3 class="view-heading" style="margin-top:22px">Tom hand tillbaka · direkt till VILA</h3><pre class="dl1-string">${esc(exampleReturn)}</pre><div class="note-box">Separat beställningskontext: <code>cardTransport=false</code>. NOT_APPLICABLE gäller här därför att returen uttryckligen sker utan korttransport. När transport eller sida är okänd används UNKNOWN.</div></div></section><section class="panel" style="margin-top:16px"><div class="panel-body"><h3 class="view-heading">Kortsida, synlighet och spelbeslut</h3><ul class="note-list"><li>FRONT/BACK/EDGE beskriver fysisk kortsida. VISIBLE/PARTIAL/OCCLUDED/OUT_OF_FRAME beskriver synlighet.</li><li>En blå/gul overlay visar författad policy. Den verifierar inte originalfilmens fysiska kortsida.</li><li>Handfaser och sidspår binds till källrutor och bevis. Okända uppgifter förblir UNKNOWN.</li><li>Motorns revealAllowed avgör om kortidentitet får visas; det är skilt från att en fysisk framsida syns.</li></ul></div></section></div>${namingEvidencePanel(selectedAction())}`;}

function categoryLabel(id){return arr(S.data?.categories).find(c=>c.id===id)?.label||id||'Övrigt';}
function filterActions(){const q=S.search.trim().toLocaleLowerCase('sv');return arr(S.data?.actions).filter(a=>(S.category==='all'||a.categoryId===S.category)&&(!q||[a.id,displayCode(a),a.code,searchableAliases(a),a.label,a.clipSlotId,a.cardPlacementId,a.from,a.to,a.media?.path,a.reviewMedia?.id,a.reviewMedia?.path].filter(Boolean).join(' ').toLocaleLowerCase('sv').includes(q)));}
function filterSlots(){const q=S.search.trim().toLocaleLowerCase('sv');return arr(S.data?.slots).filter(a=>(S.category==='all'||a.categoryId===S.category)&&(!q||[a.id,a.label,a.categoryId,a.from,a.to].filter(Boolean).join(' ').toLocaleLowerCase('sv').includes(q)));}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3300);}
async function loadData(manual=false){if(S.loading)return;S.loading=true;try{if(location.protocol==='file:')throw Error('Öppna en exporterad dealer-map.json med knappen nedan, eller starta webbversionen via en lokal HTTP-server.');const headers={};if(S.etag&&!manual)headers['If-None-Match']=S.etag;const r=await fetch('./dealer-map.json',{cache:'no-cache',headers});if(r.status===304){S.status='Kontrollerad '+fmtDate(new Date().toISOString());renderStatus();return;}if(!r.ok)throw Error('Kartfilen kunde inte hämtas (HTTP '+r.status+').');const data=validated(await r.json());const version=versionOf(data);if(S.data&&!manual&&!version){S.notice='Den hämtade filen saknar källversion. Automatisk uppdatering är pausad.';render();return;}if(S.data&&!manual&&version===S.version){S.status='Oförändrad källversion · kontrollerad '+fmtDate(new Date().toISOString());renderStatus();return;}S.etag=r.headers.get('ETag');S.data=data;S.version=version;S.local=false;S.preview=false;S.notice=version?'':'Källversion saknas. Kontrollera proveniens innan materialet används.';S.status='Inläst '+fmtDate(new Date().toISOString());if(!actionById(S.selected))S.selected=arr(data.actions).find(a=>a.id==='request.p1.c1.deal')?.id||arr(data.actions).find(a=>displayCode(a)==='P1.C1')?.id||arr(data.actions)[0]?.id||null;render();if(manual)toast('Kartdata uppdaterade');}catch(e){S.status=String(e.message||e);if(!S.data)renderError(S.status);else{S.notice='Senaste hämtningen misslyckades. Den redan inlästa versionen visas. '+S.status;render();}}finally{S.loading=false;}}
function renderError(message){MAIN.innerHTML=`<div class="error-screen"><div class="eyebrow">KÄLLDATA SAKNAS</div><h2>Välj en kartfil</h2><p>${esc(message)}</p><p>Programmet visar befintliga projektdata. Exportera först en normaliserad <code>dealer-map.json</code> med Python-programmet.</p><div class="buttons"><button class="button primary" data-command="import">${icon('upload')}Öppna kartfil</button><button class="button" data-command="refresh">Försök igen</button></div></div>`;}
function summaryStats(){const st=S.data.stats||{},acts=arr(S.data.actions),places=arr(S.data.placements);const have=n(st.candidateTargets??places.filter(p=>p.candidate).length),all=n(st.requiredTargets??places.length);const pc=all?have/all*100:0;return `<section class="stats" aria-label="Täckning och status"><div class="stat"><div class="stat-top">Givmål med kandidat${icon('card')}</div><div class="stat-number">${have}<small>/ ${all}</small></div><div class="stat-note">${pc.toLocaleString('sv-SE',{maximumFractionDigits:1})} % kandidattäckning · separat QA</div><div class="bar"><i style="width:${Math.min(100,Math.max(0,pc))}%"></i></div></div><div class="stat"><div class="stat-top">Registrerade handlingar<span class="stat-icon">${icon('map')}</span></div><div class="stat-number">${n(st.actionCount??acts.length)}</div><div class="stat-note">Källbundna rörelser i kontraktet</div><div class="bar"><i style="width:100%;background:#b7cbbd"></i></div></div><div class="stat"><div class="stat-top">Godkända i kontraktet<span class="stat-icon">${icon('check')}</span></div><div class="stat-number">${n(st.approvedActions??acts.filter(a=>a.status==='approved').length)}<small>/ ${acts.length}</small></div><div class="stat-note">${n(st.edgeGates)} skarvgrindar i underlaget</div><div class="bar"><i style="width:${acts.length?acts.filter(a=>a.status==='approved').length/acts.length*100:0}%"></i></div></div><div class="stat"><div class="stat-top">Produktens klippfack<span class="stat-icon">${icon('grid')}</span></div><div class="stat-number">${n(st.slotCount??arr(S.data.slots).length)}</div><div class="stat-note">${n(st.blackjackSlots)} blackjack · ${n(st.rouletteSlots)} roulette</div><div class="bar"><i style="width:100%;background:#c7d2bc"></i></div></div></section>`;}
function filters(){const cats=arr(S.data.categories);return `<div class="filter-row" aria-label="Filtrera kategori"><button class="filter-chip ${S.category==='all'?'active':''}" data-category="all">Alla</button>${cats.map(c=>`<button class="filter-chip ${S.category===c.id?'active':''}" data-category="${esc(c.id)}">${esc(c.label)}<b>${n(c.count)}</b></button>`).join('')}</div>`;}

function actionCards(list){if(!list.length)return '<div class="panel empty"><strong>Inga matchande handlingar</strong>Ändra sökningen eller kategorifiltret.</div>';return `<div class="action-list">${list.map(a=>`<button class="action-card ${S.selected===a.id?'selected':''}" data-select="${esc(a.id)}"><span class="action-code ${a.from==='VILA'&&a.to==='VILA'?'idle':''}">${esc(displayCode(a)||(a.from==='VILA'&&a.to==='VILA'?'V':'↔'))}</span><span><strong>${esc(a.label||a.id)}</strong><small>${esc(a.from||'?')} → ${esc(a.to||'?')} · ${a.media?.fps?esc(a.media.fps)+' fps':'tidsbas saknas'}</small>${badge(a.status)}</span></button>`).join('')}</div>`;}
function mapView(){const list=filterActions();return `<div>${flow()}<div class="section-head"><h2>Handlingar i banken</h2><small>${list.length} av ${arr(S.data.actions).length} visas</small></div>${filters()}${actionCards(list)}</div>${detailView()}`;}
function slotsView(){const list=filterSlots();return `<div>${filters()}<div class="info-banner">${arr(S.data.categories).length} visningsgrupper samlar ${arr(S.data.slots).length} produktfack. Referensscheman är separata jämförelsekällor.</div><div class="slot-grid">${list.map(s=>{const acts=arr(s.actionIds);return `<article class="slot ${S.selectedSlot===s.id?'selected':''}"><div class="badges">${badge(s.status)}${badge('reference',s.game||'Katalog')}</div><h3>${esc(s.label||s.id)}</h3><div class="mono">${esc(s.id)}</div><div class="slot-meta">${arr(s.variants).map(v=>`<span class="badge">${esc(v.id)} · ${esc(v.from||'?')}→${esc(v.to||'?')}</span>`).join('')}</div><button data-slot="${esc(s.id)}">${acts.length?acts.length+' bundna handlingar →':'Visa fackets detaljer →'}</button></article>`}).join('')}</div>${!list.length?'<div class="panel empty">Inga fack matchar filtret.</div>':''}</div>${detailView()}`;}
function placementButton(p){return `<button class="tiny-card ${p.candidate?'':'missing'} ${S.selectedPlacement===p.id?'selected':''}" data-placement="${esc(p.id)}" title="${esc(displayCode(p))} · ${p.candidate?'kandidat':'film saknas'}">${esc(displayCode(p))}</button>`;}

}
function schemesView(){const ss=arr(S.data.schemes);return `<div><div class="info-banner">${ss.length} separata referensscheman. Namnlikhet innebär inte att tagningar, poser eller koordinater är utbytbara. Den aktuella körplanen visas under Rörelsekarta.</div>${ss.map(s=>`<section class="scheme"><div class="badges">${badge('reference','Referensschema')}</div><h3 style="margin-top:10px">${esc(s.label||s.id)}</h3><p>${esc(s.summary||'Beskrivning saknas i källan.')}</p><div class="scheme-states">${arr(s.states).map(v=>`<span>${esc(typeof v==='string'?v:v.label||v.id||JSON.stringify(v))}</span>`).join('')}</div><p class="mono">${esc(s.sourceRef||s.sourcePath||'Källrevision saknas')}</p><details><summary>${arr(s.transitions).length} deklarerade relationer · visa översikt</summary><div class="scheme-transitions">${arr(s.transitions).map(t=>`<div class="scheme-transition"><strong>${esc(t.label||t.id||"Rörelse")}</strong><span>${esc(t.from||"?")} → ${esc(t.to||"?")}</span><small>${esc(t.clipKey||t.assetPath||t.id||"Källbindning saknas")}</small></div>`).join("")}</div><p class="detail-note">Kompakt referensvy. Fullständiga koordinat- och bevisdata finns kvar i kartfilen.</p></details></section>`).join('')}${!ss.length?'<div class="panel empty">Inga referensscheman finns i denna kartfil.</div>':''}</div>${provenancePanel()}`;}
function detailView(){if(S.view==='table'&&S.selectedPlacement){const p=arr(S.data.placements).find(p=>p.id===S.selectedPlacement);if(p)return placementDetail(p);}if(S.view==='slots'&&S.selectedSlot){const s=arr(S.data.slots).find(s=>s.id===S.selectedSlot);if(s)return slotDetail(s);}const a=selectedAction();if(!a)return '<aside class="panel detail"><div class="empty">Välj en handling för att se dess källor och gränsrutor.</div></aside>';const m=a.media||{};const url=mediaLink(a);const review=!!urlSafe(a.reviewMedia?.url);return `<aside class="panel detail"><div class="detail-title"><div class="eyebrow">VALD HANDLING · ${esc(categoryLabel(a.categoryId))}</div><h2>${esc(displayCode(a)||a.label||a.id)}</h2><p>${esc(a.label||a.id)}</p><div class="badges" style="margin-top:11px">${badge(a.status)}${badge('reference',a.presentation||'Lagerstatus okänd')}</div></div><div class="detail-section"><h3>Kroppsposer & fack</h3><div class="pose-row"><span class="pose-tag">${esc(a.from||'?')}</span><span class="pose-arrow">→</span><span class="pose-tag">${esc(a.to||'?')}</span></div><dl class="kv"><dt>Klippfack</dt><dd class="mono">${esc(a.clipSlotId||'Ingen bindning')}</dd><dt>Kortplacering</dt><dd class="mono">${esc(a.cardPlacementId||'Ej tillämpligt')}</dd><dt>Direktretur</dt><dd>${a.directReturnVerified?'Verifierad':'Ej verifierad'}</dd><dt>Returpolicy</dt><dd>${esc(a.returnMode||'unknown')}</dd></dl></div><div class="detail-section"><h3>Källfilm</h3><dl class="kv"><dt>Källrutor</dt><dd>${m.startFrame!==null&&m.startFrame!==undefined?esc(m.startFrame)+'–'+esc(m.endFrameExclusive)+' (slut exkl.)':'Saknas'}</dd><dt>Tidsbas</dt><dd>${m.fps?esc(m.fps)+' fps':'Saknas'}</dd><dt>Bildplan</dt><dd>${m.width&&m.height?esc(m.width)+' × '+esc(m.height):'Saknas'}</dd><dt>QA</dt><dd>${esc(statusLabel(a.qaStatus))}</dd></dl><div class="hash mono">${esc(m.sha256||'Ingen källhash registrerad')}</div><p class="detail-note mono">${esc(m.path||m.assetId||'Ingen källfil bunden')}</p>${url?`<a class="button primary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('play')}${review?'Öppna granskningsfilm':'Öppna källfilm'}</a>`:'<button class="button" disabled>Ingen publik filadress</button>'}${review?'<p class="detail-note">Granskningsfilmen är en separat härledning. Dess hash visas i granskningsunderlaget.</p>':''}</div><div class="detail-section"><h3>Namn & DL1</h3><p class="detail-note">Primär adress: <strong>${esc(displayCode(a)||"Ej tillämpligt")}</strong>. Beställning: ${a.motionNaming?.requested?"registrerad":"saknas"}. Observerad DL1: ${esc(observedNamingLabel(a))}.</p><p class="detail-note">Källans observationsbevis har inte validerats av denna läsvy.</p>${aliasDetails(a)}<button class="button" data-view="naming">Visa namnunderlag →</button></div><div class="detail-section"><h3>Bevisgräns</h3><div class="note-box">${a.status==='approved'?'Godkänd enligt inläst källstatus. Kontrollera omfattningen i QA-beviset.':'En registrerad film är en kandidat. QA, lagerseparation och skarvgrindar bedöms var för sig.'}</div>${arr(a.notes).length?`<ul class="note-list" style="margin-top:10px">${arr(a.notes).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<button class="button" data-command="copy-review">${icon('copy')}Kopiera granskningsunderlag</button></div></aside>`;}
function placementDetail(p){return `<aside class="panel detail"><div class="detail-title"><div class="eyebrow">GIVMÅL</div><h2>${esc(displayCode(p))}</h2><p>${p.recipient==='D'?'Dealern':'Spelarplats '+esc(p.seat)} · kort ${esc(p.ordinal)}</p><div class="badges" style="margin-top:11px">${badge(p.candidate?'candidate':'missing')}</div></div><div class="detail-section"><h3>Identifierare</h3><dl class="kv"><dt>Placering</dt><dd class="mono">${esc(p.id)}</dd><dt>Klippfack</dt><dd class="mono">${esc(p.clipSlotId||'Inte bundet')}</dd><dt>Spelhand-ID</dt><dd>${esc(p.handId||'Ej angiven i källan')}</dd></dl>${aliasDetails(p)}</div><div class="detail-section"><h3>Koordinater</h3><dl class="kv"><dt>Koordinatrum</dt><dd>${esc(p.coordinateSpace||'Okänt')}</dd><dt>Mätstatus</dt><dd>${esc(p.measurementStatus||'unknown')}</dd><dt>Landningshörn</dt><dd>${p.landingQuad?`<span class="mono">${esc(JSON.stringify(p.landingQuad))}</span>`:'Ej dokumenterade'}</dd></dl><div class="note-box">P2.C2 är en adress till ett givmål. Den anger inte en fysisk x/y-position. Uppskattade skärmpositioner används inte som källkalibrering.</div></div><div class="detail-section"><h3>Bundna handlingar</h3>${arr(p.actionIds).length?arr(p.actionIds).map(id=>`<button class="button" data-select="${esc(id)}">${esc(actionById(id)?.label||id)} →</button>`).join(''):'<p class="detail-note">Ingen handling finns bunden till detta givmål.</p>'}</div></aside>`;}
function slotDetail(s){return `<aside class="panel detail"><div class="detail-title"><div class="eyebrow">KLIPPFACK · ${esc(categoryLabel(s.categoryId))}</div><h2>${esc(s.label||s.id)}</h2><p class="mono">${esc(s.id)}</p><div class="badges" style="margin-top:11px">${badge(s.status)}</div></div><div class="detail-section"><h3>Fackvarianter</h3>${arr(s.variants).map(v=>`<div class="pose-row"><span class="badge reference">${esc(v.id)}</span><span class="pose-tag">${esc(v.from||'?')}</span><span class="pose-arrow">→</span><span class="pose-tag">${esc(v.to||'?')}</span></div>`).join('')||'<p class="detail-note">Inga posevarianter deklarerade.</p>'}<p class="detail-note">Suffix är fackspecifika. En variant anger ändposer, men bevisar inte handens väg.</p></div><div class="detail-section"><h3>Handlingar</h3>${arr(s.actionIds).map(id=>`<button class="button" data-select="${esc(id)}">${esc(displayCode(actionById(id))||actionById(id)?.label||id)} →</button>`).join('')||'<p class="detail-note">Inga lokala handlingar är bundna till facket.</p>'}</div><div class="detail-section"><h3>Ursprung</h3><p class="detail-note mono">${esc(s.sourcePath||'Källsökväg saknas')}</p><ul class="note-list">${arr(s.notes).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></aside>`;}
function provenancePanel(){const p=S.data.provenance||{},i=S.data.identity||{};return `<aside class="panel detail"><div class="detail-title"><div class="eyebrow">VERSION & URSPRUNG</div><h2>En spårbar källa</h2><p>Webbvyn visar den exporterade kontraktsversionen.</p></div><div class="detail-section"><h3>Identitet</h3><dl class="kv"><dt>Projekt</dt><dd>${esc(i.projectId||'Okänt')}</dd><dt>Dealer</dt><dd class="mono">${esc(i.dealerId||'Okänd')}</dd><dt>Bank</dt><dd class="mono">${esc(i.bankId||'Okänd')}</dd><dt>Revision</dt><dd class="mono">${esc(i.revision||'Okänd')}</dd></dl></div><div class="detail-section"><h3>Publicerat underlag</h3><dl class="kv"><dt>Commit</dt><dd class="mono">${esc(p.commit||p.sourceCommit||'Saknas')}</dd><dt>Snapshot</dt><dd class="mono">${esc(p.snapshot||p.snapshotId||'Saknas')}</dd><dt>Hämtat</dt><dd>${esc(fmtDate(p.fetchedAt||p.generatedAt||p.loadedAt))}</dd><dt>Visningskälla</dt><dd>${S.preview?'Offlineförhandsvisning':S.local?'Lokal kartfil':(p.sourceMode==='local'?'Export av lokal källa':'Webbexport')}</dd></dl></div><div class="detail-section"><h3>Granskningsdialog</h3><a class="button primary" href="${esc(issueUrl())}" target="_blank" rel="noopener noreferrer">${icon('external')}Öppna Issue #${esc(issueNumber())}</a><p class="detail-note">Kommentarer är överlämning och granskningsunderlag. De ändrar inte kontrakt eller QA automatiskt.</p></div></aside>`;}
function reviewView(){const warnings=arr(S.data.warnings);return `<div><section class="panel"><div class="panel-head"><div><h2>Granskningsstatus</h2><p>Uppgifter och begränsningar från adaptern</p></div>${badge('reference','Källbunden')}</div><div class="panel-body">${warnings.length?`<ul class="note-list" style="font-size:11px;line-height:1.9">${warnings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="detail-note">Inga adaptervarningar registrerade.</p>'}<div class="section-head"><h2>Direktreturproven</h2></div>${arr(S.data.routeRequirements).map(r=>`<div class="table-row" style="padding-left:0;grid-template-columns:1fr auto"><div><strong>${esc(displayCode(r)?'Direktretur efter '+displayCode(r):r.label||r.id)}</strong><small style="display:block">SLÄPP → VILA · ${n(r.preservedCards)} kort ska ligga kvar</small></div>${badge(routeVerified(r)?'approved':'missing',routeVerified(r)?'Verifierad i källan':'Ej verifierad')}</div>`).join('')}</div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Dialog i Issue #${esc(issueNumber())}</h2><p>Hämtas från publika GitHub · inga inloggningsuppgifter</p></div><button class="button small" data-command="load-comments">${icon('refresh')}Hämta</button></div><div class="comments" id="comments">${commentsHtml()}</div></section></div>${provenancePanel()}`;}
function commentsHtml(){if(S.commentsLoading)return '<p class="detail-note">Hämtar kommentarer…</p>';if(S.commentsError)return `<div class="warning-banner">${esc(S.commentsError)}<br><a href="${esc(issueUrl())}" target="_blank" rel="noopener noreferrer">Läs tråden på GitHub →</a></div>`;if(!S.comments)return '<div class="empty">Tryck Hämta för att läsa den gemensamma tråden.<br><small>Avsändare och text visas som referensdata.</small></div>';if(!S.comments.length)return '<div class="empty">Tråden har ännu inga kommentarer.</div>';return S.comments.map(c=>`<article class="comment"><div class="comment-head"><strong>${esc(c.user?.login||'Okänd avsändare')}</strong><a href="${esc(urlSafe(c.html_url)||issueUrl())}" target="_blank" rel="noopener noreferrer">${esc(fmtDate(c.created_at))} ↗</a></div><div class="comment-body">${esc(c.body||'')}</div></article>`).join('');}
async function loadComments(){if(S.commentsLoading)return;S.commentsLoading=true;S.commentsError=null;render();try{let all=[];for(let page=1;page<=3;page++){const r=await fetch(issueApi()+'?per_page=100&page='+page,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(r.status===403||r.status===429?'GitHubs gräns för anonyma API-anrop är nådd.':'Kommentarerna kunde inte hämtas (HTTP '+r.status+').');const rows=await r.json();if(!Array.isArray(rows))throw Error('GitHub svarade med oväntat format.');all.push(...rows);if(rows.length<100)break;}S.comments=all.reverse();}catch(e){S.commentsError=e.message||String(e);}finally{S.commentsLoading=false;render();}}
function renderStatus(){const t=document.getElementById('statusText');if(t)t.textContent=S.status;}
function render(){if(!S.data)return;const d=S.data,p=d.provenance||{},i=d.identity||{};document.title='Dealerlab · '+VIEW_NAMES[S.view];document.getElementById('sidebarIdentity').textContent=i.label||'Dealerlab';document.getElementById('sidebarRevision').textContent=(i.bankId||'Bank saknas')+' · '+short(p.commit||p.sourceCommit);document.getElementById('breadcrumbView').textContent=VIEW_NAMES[S.view];document.getElementById('issueLink').href=issueUrl();document.getElementById('issueLink').innerHTML=icon('chat')+'<span>Issue #'+esc(issueNumber())+'</span>';if(location.protocol==='file:'){const refresh=document.querySelector('.top-actions [data-command=refresh]');if(refresh){refresh.innerHTML=icon('upload')+'<span>Öppna kartfil</span>';refresh.title='Välj en ny normaliserad kartfil';}}document.querySelectorAll('[data-view]').forEach(el=>{el.classList.toggle('active',el.dataset.view===S.view);el.setAttribute('aria-current',el.dataset.view===S.view?'page':'false');});const content=({map:mapView,slots:slotsView,table:tableView,naming:namingView,schemes:schemesView,review:reviewView}[S.view]||mapView)();MAIN.innerHTML=`<section class="hero"><div><div class="eyebrow">DEALERLAB / ${esc(i.dealerId||'OKÄND IDENTITET')}</div><h1>${esc(VIEW_NAMES[S.view])}</h1><p>${esc(VIEW_SUB[S.view])}</p></div><div class="identity-chip"><div class="avatar">${esc((i.label||'DL').split(/\s/).map(s=>s[0]).filter(Boolean).slice(0,2).join(''))}</div><div><strong>${esc(i.label||'Dealerlab')}</strong><small>${esc(i.bankId||'Bank saknas')}</small></div></div></section>${S.notice?`<div class="warning-banner" role="status">${esc(S.notice)}</div>`:''}${summaryStats()}<div class="toolbar"><div class="revision"><span class="dot" style="background:#82a38a"></span>${S.preview?'OFFLINE':S.local?'LOKAL FIL':(p.sourceMode==='local'?'LOKAL EXPORT':'GITHUB')} · ${esc(short(p.commit||p.sourceCommit))}<span style="font:10px Arial,'Noto Sans Display','DejaVu Sans',sans-serif;color:#8a9790;margin-left:5px">${esc(i.revision||'Revision saknas')}</span></div>${['map','slots','table'].includes(S.view)?`<label class="search">${icon('search')}<input id="search" type="search" value="${esc(S.search)}" placeholder="Sök P2.C2, K-alias, vila eller fil…" aria-label="Sök handling, fack eller placering"></label>`:''}</div><div class="content-grid">${content}</div><footer class="statusline"><span class="status-text" id="statusText">${esc(S.status)}</span><label class="auto-label"><input type="checkbox" id="autoRefresh" ${S.auto?'checked':''} ${S.local?'disabled':''}>Kontrollera ny källversion var 60 s</label></footer>`;}
function chooseAction(id){S.selected=id;S.selectedPlacement=null;S.selectedSlot=null;if(!['map','slots','naming'].includes(S.view))S.view='map';render();}
async function copyReview(){const a=selectedAction();if(!a)return;const p=S.data.provenance||{},m=a.media||{};const text=['Typ: REVIEW','Handling: '+a.id,'Kod: '+(displayCode(a)||'–'),'Spårbara alias: '+(searchableAliases(a)||'inga registrerade'),'Projekt: '+(S.data.identity?.projectId||'okänt'),'Dealer: '+(S.data.identity?.dealerId||'okänt'),'Bank: '+(S.data.identity?.bankId||'okänd'),'Commit: '+(p.commit||p.sourceCommit||'saknas'),'Snapshot: '+(p.snapshot||p.snapshotId||'saknas'),'Källa: '+(m.path||'saknas'),'SHA-256: '+(m.sha256||'saknas'),'Källrutor: '+m.startFrame+'–'+m.endFrameExclusive+' (slut exkl.)','Tidsbas: '+m.fps+' fps','QA i källan: '+a.qaStatus,'Granskningsfilm: '+(a.reviewMedia?.path||'saknas'),'Granskningsfilm SHA-256: '+(a.reviewMedia?.sha256||'saknas'),'Granskningsfilm URL: '+(urlSafe(a.reviewMedia?.url)||'saknas'),'Råbindningens rutor gäller inte automatiskt granskningsfilmen.','DL1 beställd: '+JSON.stringify(a.motionNaming?.requested??null),'DL1 observerad (källans uppgift, ej validerad av läsvyn): '+JSON.stringify(a.motionNaming?.observed??{status:'unverified',fields:null,evidence:[]}),'DL1 separat kontext: '+JSON.stringify(a.motionNaming?.context??{anatomicalHand:'UNKNOWN',cameraMirrored:null}),'Äldre from/to är kroppsposer, inte automatiskt DL1-ändpunkter.','En observed-statussträng innebär ingen egen kvalitetsacceptans i denna läsvy.','Uppmätt:','Observerat:','Hypotes:','Okänt:','Godkännandekrav:'].join('\n');try{await navigator.clipboard.writeText(text);toast('Granskningsunderlaget är kopierat');}catch{const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='dealerlab-granskningsunderlag.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),3000);toast('Underlaget har sparats som textfil');}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-view],[data-command],[data-select],[data-category],[data-placement],[data-slot],[data-pose]');if(!el)return;if(el.dataset.view){S.view=el.dataset.view;S.search='';S.category='all';S.selectedSlot=null;S.selectedPlacement=null;render();return;}if(el.dataset.select){chooseAction(el.dataset.select);return;}if(el.dataset.category){S.category=el.dataset.category;render();return;}if(el.dataset.placement){S.selectedPlacement=el.dataset.placement;S.view='table';render();return;}if(el.dataset.slot){S.selectedSlot=el.dataset.slot;render();return;}if(el.dataset.pose){S.search=el.dataset.pose;S.category='all';render();document.getElementById('search')?.focus();return;}if(el.dataset.command==='import')document.getElementById('fileInput').click();if(el.dataset.command==='refresh'){if(location.protocol==='file:')document.getElementById('fileInput').click();else loadData(true);}if(el.dataset.command==='copy-review')copyReview();if(el.dataset.command==='load-comments')loadComments();});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-pose]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('input',event=>{if(event.target.id==='search'){const start=event.target.selectionStart,end=event.target.selectionEnd;S.search=event.target.value;render();const input=document.getElementById('search');input?.focus();try{input?.setSelectionRange(start,end)}catch{}}});
document.addEventListener('change',event=>{if(event.target.id==='autoRefresh')S.auto=event.target.checked;if(event.target.id==='namingAction'){S.selected=event.target.value;S.selectedSlot=null;S.selectedPlacement=null;render();}});
document.getElementById('fileInput').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('Kartfilen är för stor. Exportera bara normaliserade metadata.');const data=validated(JSON.parse(await file.text()));S.data=data;S.local=true;S.preview=false;S.version=versionOf(data);S.selected=arr(data.actions).find(a=>a.id==='request.p1.c1.deal')?.id||arr(data.actions).find(a=>displayCode(a)==='P1.C1')?.id||arr(data.actions)[0]?.id||null;S.notice='Lokal fil: '+file.name+'. Automatisk webbhämtning är pausad för denna visning.';S.status='Inläst lokalt '+fmtDate(new Date().toISOString());S.selectedPlacement=null;S.selectedSlot=null;render();toast('Kartfilen är inläst');}catch(e){toast(e.message||String(e));}finally{event.target.value='';}});
// Read-only hooks for the native Python shell. They expose data, never code execution or writes.
window.dealerMapReload=(manual=true)=>{if(S.local&&!manual)return;return loadData(manual);};
window.dealerMapSelection=()=>({actionId:S.selected,slotId:S.selectedSlot,placementId:S.selectedPlacement,action:actionById(S.selected)||null});
window.dealerMapModel=()=>S.data;
function loadEmbeddedPreview(){
  if(location.protocol!=='file:')return false;
  const embedded=document.getElementById('embedded-map');
  if(!embedded)return false;
  try{
    const data=validated(JSON.parse(embedded.textContent));
    S.data=data;S.local=true;S.preview=true;S.auto=false;S.version=versionOf(data);
    S.selected=arr(data.actions).find(a=>a.id==='request.p1.c1.deal')?.id||arr(data.actions).find(a=>displayCode(a)==='P1.C1')?.id||arr(data.actions)[0]?.id||null;
    S.notice='Offlineförhandsvisning med inbäddad kartdata. Öppna en ny kartfil för att byta version. Filmer och GitHub-länkar kräver anslutning.';
    S.status='Offline · '+(data.provenance?.snapshot||data.provenance?.reviewSnapshot||data.identity?.revision||'Källversion saknas');
    render();
  }catch(error){renderError('Den inbäddade kartfilen kunde inte läsas: '+(error.message||String(error)));}
  return true;
}
setInterval(()=>{if(S.auto&&!S.local&&document.visibilityState==='visible'&&S.data)loadData(false);},60000);
function startMap(){if(!loadEmbeddedPreview())loadData();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startMap,{once:true});else startMap();
</script>
</body>
