name: Dealer map

on:
  push:
    branches: [main]
    paths:
      - 'tools/dealer-map/**'
      - '.github/workflows/dealer-map-pages.yml'
      - 'references/dealer-map.json'
      - 'references/pamela-motion-contract.json'
      - 'references/dealers.json'
      - 'references/schemes.json'
      - 'references/terminology.json'
      - 'references/pamela-two-sided-bank.json'
      - 'references/pamela-idle-chain-review.json'
      - 'references/public-review.json'
      - 'public-source.json'
  pull_request:
    paths:
      - 'tools/dealer-map/**'
      - '.github/workflows/dealer-map-pages.yml'
      - 'references/dealer-map.json'
      - 'references/pamela-motion-contract.json'
      - 'references/dealers.json'
      - 'references/schemes.json'
      - 'references/terminology.json'
      - 'references/pamela-two-sided-bank.json'
      - 'references/pamela-idle-chain-review.json'
      - 'references/public-review.json'
      - 'public-source.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealer-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read this exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check source normalization
        run: |
          python -m unittest discover -s tools/dealer-map -p test_dealer_map_data.py -v
          python -m unittest discover -s tools/dealer-map -p test_dealer_map_io.py -v
          python -m unittest discover -s tools/dealer-map -p test_dealer_map_sequence.py -v
      - name: Build static map from repository contracts
        run: python tools/dealer-map/dealer_map.py --export-web _site --repo-root . --include-review
      - name: Check public output boundary
        run: python tools/dealer-map/publishing/check_web_export.py _site
      - name: Upload map artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 3

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEALER_MAP_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read configured Pages target
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish map
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
